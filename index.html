<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>婚禮報到系統(高雄場) · 吳宇童 ❤ 劉懷筑</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Noto+Sans+TC:wght@300;400;500;700&family=Noto+Serif+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ivory:#FBF7F2; --paper:#FFFFFF; --wine:#7E2A3D; --wine-deep:#5E1E2D;
  --gold:#C2A05C; --gold-soft:#E6D5AE; --ink:#3A2C2A; --muted:#9A887F;
  --line:#EBE1D6; --green:#4F8A6B; --green-soft:#E5F0E9; --red:#C0563F;
  --red-soft:#FBEAE5; --dark:#2A1620; --dark2:#3A2230;
  --shadow:0 8px 30px rgba(94,30,45,.10); --shadow-sm:0 2px 10px rgba(94,30,45,.06);
  --r:16px; --r-sm:11px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:"Noto Sans TC",sans-serif; color:var(--ink);
  background:var(--ivory); line-height:1.55; -webkit-font-smoothing:antialiased;
  padding-bottom:78px;
}
.serif{font-family:"Noto Serif TC",serif}
.script{font-family:"Cormorant Garamond",serif}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:16px}
h1,h2,h3,h4{margin:0;font-weight:600}
.hidden{display:none!important}

/* ---------- top header ---------- */
header.app{
  background:linear-gradient(135deg,var(--wine) 0%,var(--wine-deep) 100%);
  color:#fff; padding:14px 18px 13px; position:relative; overflow:hidden;
}
header.app::after{
  content:"";position:absolute;inset:0;
  background:radial-gradient(circle at 88% -10%,rgba(226,213,174,.22),transparent 45%);
  pointer-events:none;
}
.hd-row{display:flex;align-items:center;justify-content:space-between;gap:10px;position:relative}
.hd-names{font-family:"Noto Serif TC",serif;font-size:18px;font-weight:600;letter-spacing:.5px;display:flex;align-items:center;gap:8px}
.hd-heart{color:var(--gold-soft);font-size:14px}
.hd-sub{font-size:12px;color:rgba(255,255,255,.62);letter-spacing:1.5px;margin-top:2px}
.mode-chip{
  font-size:12px;font-weight:500;padding:4px 10px;border-radius:20px;
  border:1px solid rgba(255,255,255,.28);display:flex;align-items:center;gap:5px;white-space:nowrap;
}
.mode-dot{width:7px;height:7px;border-radius:50%;background:var(--gold-soft)}
.mode-chip.cloud .mode-dot{background:#7ED9A8;box-shadow:0 0 0 3px rgba(126,217,168,.25)}
.hd-right{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.op-chip{font-size:12px;font-weight:500;padding:4px 11px;border-radius:20px;background:rgba(255,255,255,.16);
  border:1px solid rgba(255,255,255,.3);color:#fff;display:flex;align-items:center;gap:5px;max-width:140px}
.op-chip span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.op-chip.unset{background:var(--gold);color:var(--wine-deep);border-color:var(--gold);font-weight:700}
/* identify */
.id-quick{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 4px}
.id-quick button{padding:11px 16px;border-radius:12px;border:1px solid var(--line);background:var(--paper);font-size:15px;font-weight:500}
.id-quick button:active{background:var(--gold-soft);border-color:var(--gold)}
/* audit log */
.log-item{display:flex;gap:11px;padding:11px 4px;border-bottom:1px solid var(--line)}
.log-item:last-child{border-bottom:none}
.log-op{flex-shrink:0;min-width:60px;font-size:13px;font-weight:600;color:var(--wine);padding-top:2px}
.log-body{flex:1;min-width:0}
.log-act{font-size:14px}
.log-act .badge{font-size:12px;padding:1px 8px;border-radius:20px;margin-right:6px;font-weight:500}
.badge.in{background:var(--green-soft);color:var(--green)}
.badge.un{background:var(--red-soft);color:var(--red)}
.badge.ed{background:#EEE7F0;color:#7A5A82}
.badge.lt{background:#FCEFE0;color:#B07A2E}
.badge.sy{background:var(--ivory);color:var(--muted)}
.log-detail{font-size:13px;color:var(--muted);margin-top:2px}
.log-time{flex-shrink:0;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;padding-top:2px}
.who-stamp{font-size:13px;color:var(--muted);text-align:center;margin:-6px 0 12px}
/* 同行人 */
.comp-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.comp-idx{width:24px;height:24px;border-radius:50%;background:var(--ivory);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--muted);flex-shrink:0;font-family:"Cormorant Garamond",serif;font-weight:600}
.comp-row input{flex:1}
.comp-del{width:32px;height:32px;border-radius:9px;background:var(--red-soft);color:var(--red);font-size:17px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.comp-add{width:100%;padding:11px;border-radius:11px;border:1px dashed var(--gold);background:#FCF6EC;color:var(--gold);font-weight:500;font-size:14px;margin-top:2px}
.comp-hint{font-size:14px;color:var(--muted);text-align:center;margin-top:10px}
.comp-hint b{color:var(--wine);font-family:"Cormorant Garamond",serif;font-size:17px}
.party-box{background:var(--ivory);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:14px}
.party-box .pb-title{font-size:13px;color:var(--muted);margin-bottom:8px;letter-spacing:.5px}
.party-box .pb-list{display:flex;flex-wrap:wrap;gap:7px}
.party-box .pb-name{font-size:14px;padding:5px 11px;border-radius:20px;background:#fff;border:1px solid var(--line)}
.party-box .pb-name.lead{background:var(--wine);color:#fff;border-color:var(--wine);font-weight:500}

/* ---------- bottom nav ---------- */
nav.tabs{
  position:fixed;bottom:0;left:0;right:0;z-index:60;
  background:rgba(255,255,255,.94);backdrop-filter:blur(12px);
  border-top:1px solid var(--line);display:flex;
  padding:6px 4px calc(6px + env(safe-area-inset-bottom));
}
nav.tabs button{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:6px 2px;color:var(--muted);font-size:12px;border-radius:12px;transition:.18s;
}
nav.tabs button .ic{font-size:21px;line-height:1}
nav.tabs button.active{color:var(--wine)}
nav.tabs button.active .ic{transform:translateY(-1px)}

/* ---------- layout ---------- */
main{max-width:760px;margin:0 auto;padding:16px 14px 24px}
.view{animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.section-title{font-family:"Noto Serif TC",serif;font-size:20px;font-weight:600;display:flex;align-items:center;gap:8px;margin:2px 0 14px}
.section-title .eyebrow{font-family:"Cormorant Garamond",serif;font-style:italic;font-size:14px;color:var(--gold);font-weight:500}

.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow-sm)}
.pad{padding:16px}

/* ---------- dashboard ---------- */
.stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:11px;margin-bottom:14px}
.stat{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:15px 16px;position:relative;overflow:hidden;box-shadow:var(--shadow-sm)}
.stat .num{font-family:"Cormorant Garamond",serif;font-size:42px;font-weight:600;line-height:1;color:var(--wine)}
.stat .lbl{font-size:13px;color:var(--muted);margin-top:5px;letter-spacing:.5px}
.stat.gold .num{color:var(--gold)}
.stat.green .num{color:var(--green)}
.stat .corner{position:absolute;top:11px;right:13px;font-size:18px;opacity:.5}
.stat.tappable{cursor:pointer;transition:.14s}
.stat.tappable:active{transform:scale(.98);box-shadow:var(--shadow)}
.gl-row{display:flex;align-items:center;gap:11px;padding:11px 4px;border-bottom:1px solid var(--line)}
.gl-row:last-child{border-bottom:none}
.gl-tnum{width:38px;height:38px;border-radius:10px;background:var(--ivory);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-family:"Cormorant Garamond",serif;font-weight:600;color:var(--wine);flex-shrink:0}
.gl-info{flex:1;min-width:0}
.gl-name{font-weight:500}
.gl-sub{font-size:13px;color:var(--muted)}
.gl-right{flex-shrink:0;text-align:right;font-size:13px}
.gl-amt{font-family:"Cormorant Garamond",serif;font-weight:600;color:var(--gold);font-size:18px}
.gl-cancel{flex-shrink:0;padding:8px 11px;border-radius:9px;border:1px solid var(--red);color:var(--red);background:var(--paper);font-size:13px;font-weight:500;white-space:nowrap}
.gl-cancel:active{background:var(--red-soft)}

.progress-card{margin-bottom:14px;padding:18px}
.progress-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:11px}
.progress-head .big{font-family:"Cormorant Garamond",serif;font-size:30px;font-weight:600;color:var(--wine)}
.progress-head .big small{font-size:16px;color:var(--muted)}
.bar{height:12px;background:var(--ivory);border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.bar>span{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--wine));border-radius:10px;transition:width .6s cubic-bezier(.2,.8,.2,1)}

.gift-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 18px;margin-bottom:14px;
  background:linear-gradient(135deg,#fff,#FCF6EC);border:1px solid var(--gold-soft);border-radius:var(--r);box-shadow:var(--shadow-sm)}
.gift-amt{font-family:"Cormorant Garamond",serif;font-size:34px;font-weight:600;color:var(--gold);letter-spacing:.5px}
.eye-btn{padding:8px 14px;border-radius:20px;background:var(--ivory);border:1px solid var(--line);font-size:14px;color:var(--ink);display:flex;align-items:center;gap:6px}

.feed-item{display:flex;align-items:center;gap:11px;padding:11px 4px;border-bottom:1px solid var(--line);animation:slidein .4s ease}
.feed-item:last-child{border-bottom:none}
@keyframes slidein{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}
.feed-ava{width:38px;height:38px;border-radius:50%;background:var(--wine);color:#fff;display:flex;align-items:center;justify-content:center;font-family:"Noto Serif TC",serif;font-size:16px;flex-shrink:0}
.feed-name{font-weight:500}
.feed-meta{font-size:13px;color:var(--muted)}
.feed-time{margin-left:auto;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}

/* table status grid (dashboard) */
.tbl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:9px}
.tbl-mini{border:1px solid var(--line);border-radius:var(--r-sm);padding:10px;background:var(--paper)}
.tbl-mini .tn{font-weight:600;font-size:14px;margin-bottom:3px}
.tbl-mini .frac{font-family:"Cormorant Garamond",serif;font-size:22px;font-weight:600;color:var(--wine);line-height:1}
.tbl-mini .frac small{font-size:14px;color:var(--muted)}
.tbl-mini .mbar{height:5px;background:var(--ivory);border-radius:4px;margin-top:7px;overflow:hidden}
.tbl-mini .mbar>span{display:block;height:100%;background:var(--green);border-radius:4px}

/* ---------- check-in ---------- */
.searchbar{position:relative;margin-bottom:12px}
.searchbar input{width:100%;padding:18px 16px 18px 50px;border:1.5px solid var(--line);border-radius:var(--r);background:var(--paper);font-size:19px;outline:none;transition:.18s}
.searchbar input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(194,160,92,.15)}
.searchbar .si{position:absolute;left:16px;top:50%;transform:translateY(-50%);font-size:22px;opacity:.5}
.filter-row{display:flex;gap:7px;margin-bottom:13px;overflow-x:auto;padding-bottom:2px}
.chip{padding:7px 14px;border-radius:20px;border:1px solid var(--line);background:var(--paper);font-size:14px;color:var(--muted);white-space:nowrap;transition:.16s}
.chip.on{background:var(--wine);color:#fff;border-color:var(--wine)}
.chip .b{font-weight:600;margin-left:3px}

.g-card{display:flex;align-items:center;gap:12px;padding:13px 14px;margin-bottom:9px;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow-sm);transition:.16s;position:relative;overflow:hidden}
.g-card:active{transform:scale(.99)}
.g-card.done{background:#FAFCFB;border-color:var(--green-soft)}
.g-card.done::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--green)}
.g-card.giftonly{background:#FFFCF6;border-color:#EBD9B8}
.g-card.giftonly::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--gold)}
.g-card.prepaid{background:#F5FAF8;border-color:#CDE5DB}
.g-card.prepaid::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:#4F8A6B}
.g-tbl{width:46px;height:46px;border-radius:12px;background:var(--ivory);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0;line-height:1.1}
.g-tbl .t-num{font-family:"Cormorant Garamond",serif;font-size:20px;font-weight:600;color:var(--wine)}
.g-tbl .t-lbl{font-size:12px;color:var(--muted)}
.g-info{flex:1;min-width:0}
.g-name{font-weight:700;font-size:21px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;line-height:1.25}
.g-tags{display:flex;gap:6px;margin-top:4px;flex-wrap:wrap}
.tag{font-size:12px;padding:2px 8px;border-radius:20px;background:var(--ivory);color:var(--muted)}
.tag.cookie{background:#FCEFE0;color:#B07A2E}
.tag.side{background:#F0E9F2;color:#7A5A82}
.g-right{text-align:right;flex-shrink:0}
.g-edit{flex-shrink:0;width:40px;height:40px;border-radius:11px;background:var(--ivory);border:1px solid var(--line);color:var(--muted);font-size:16px;display:flex;align-items:center;justify-content:center}
.g-edit:active{background:var(--line)}
.g-status{font-size:13px;color:var(--muted)}
.g-status.ok{color:var(--green);font-weight:500}
.g-gift{font-family:"Cormorant Garamond",serif;font-weight:600;color:var(--gold);font-size:17px}

/* ---------- modal ---------- */
.overlay{position:fixed;inset:0;background:rgba(42,22,32,.5);backdrop-filter:blur(3px);z-index:100;display:flex;align-items:flex-end;justify-content:center;animation:ovf .2s ease}
@keyframes ovf{from{opacity:0}to{opacity:1}}
.sheet{background:var(--paper);width:100%;max-width:560px;border-radius:22px 22px 0 0;max-height:92vh;overflow-y:auto;animation:sheetup .28s cubic-bezier(.2,.9,.3,1);padding-bottom:env(safe-area-inset-bottom)}
@keyframes sheetup{from{transform:translateY(100%)}to{transform:none}}
.sheet-grab{width:40px;height:4px;background:var(--line);border-radius:3px;margin:10px auto 4px}
.sheet-top{position:sticky;top:0;z-index:8;background:var(--paper);border-radius:22px 22px 0 0;padding-bottom:4px}
.sheet-close{position:absolute;top:9px;right:13px;width:34px;height:34px;border-radius:50%;background:var(--ivory);border:1px solid var(--line);font-size:16px;color:var(--muted);display:flex;align-items:center;justify-content:center;z-index:9}
.sheet-close:active{background:var(--line)}
.ci-success{position:fixed;inset:0;z-index:400;background:rgba(42,22,32,.55);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:24px;animation:ovf .2s}
.cis-card{background:#fff;border-radius:24px;padding:32px 28px 26px;text-align:center;max-width:340px;width:100%;box-shadow:0 24px 70px rgba(0,0,0,.35);animation:cisPop .35s cubic-bezier(.2,.9,.3,1)}
@keyframes cisPop{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
.cis-check{width:70px;height:70px;border-radius:50%;background:var(--green);color:#fff;font-size:40px;display:flex;align-items:center;justify-content:center;margin:0 auto 14px}
.cis-title{font-family:"Noto Serif TC",serif;font-size:24px;font-weight:600;color:var(--green)}
.cis-name{font-size:18px;color:var(--ink);margin-top:6px}
.cis-table{margin-top:18px;display:flex;align-items:baseline;justify-content:center;gap:8px;background:var(--ivory);border:1px solid var(--line);border-radius:18px;padding:16px 14px}
.cis-tlabel{font-size:16px;color:var(--muted)}
.cis-tnum{font-family:"Cormorant Garamond",serif;font-size:66px;font-weight:600;color:var(--wine);line-height:.9}
.cis-tunit{font-size:22px;color:var(--muted)}
.cis-notable{margin-top:18px;font-size:20px;color:var(--muted);background:var(--ivory);border-radius:16px;padding:16px}
.cis-hint{font-size:13px;color:var(--muted);margin-top:16px}
.sheet-pad{padding:8px 20px 22px}
.sheet-head{text-align:center;padding:8px 0 16px;border-bottom:1px solid var(--line);margin-bottom:16px}
.sheet-head .nm{font-family:"Noto Serif TC",serif;font-size:24px;font-weight:600}
.sheet-head .meta{font-size:14px;color:var(--muted);margin-top:5px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.cookie-banner{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:14px;margin-bottom:16px;font-weight:500}
.cookie-banner.need{background:linear-gradient(135deg,#FCEFE0,#FBE3CB);color:#A8691F;border:1px solid #EBC79A}
.cookie-banner.no{background:var(--ivory);color:var(--muted);border:1px solid var(--line)}
.cookie-banner .cb-ic{font-size:26px}
.cookie-banner .cb-t{flex:1}
.cookie-banner .cb-t b{font-size:16px;display:block}
.cookie-banner .cb-t span{font-size:13px;opacity:.85}
.toggle{position:relative;width:50px;height:29px;border-radius:20px;background:var(--line);transition:.2s;flex-shrink:0}
.toggle.on{background:var(--green)}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:23px;height:23px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.toggle.on::after{transform:translateX(21px)}

.field-lbl{font-size:14px;color:var(--muted);margin:14px 0 7px;font-weight:500}
.gift-input{display:flex;align-items:center;border:1.5px solid var(--line);border-radius:14px;padding:6px 14px;background:var(--paper)}
.gift-input:focus-within{border-color:var(--gold);box-shadow:0 0 0 3px rgba(194,160,92,.15)}
.gift-input .ntd{font-family:"Noto Serif TC",serif;font-size:20px;color:var(--muted);margin-right:6px}
.gift-input input{border:none;outline:none;flex:1;font-family:"Cormorant Garamond",serif;font-size:30px;font-weight:600;color:var(--wine);background:transparent;width:100%}
.quick-amt{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.quick-amt button{padding:8px 13px;border-radius:20px;border:1px solid var(--line);background:var(--paper);font-size:14px;color:var(--ink);transition:.14s}
.quick-amt button:active{background:var(--gold-soft);border-color:var(--gold)}
.quick-divider{height:1px;background:var(--line);margin:11px 2px 10px}
.quick-amt button.sel{background:var(--wine);color:#fff;border-color:var(--wine);font-weight:500;box-shadow:0 3px 10px rgba(126,42,61,.25)}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:15px;border-radius:14px;font-size:16px;font-weight:500;transition:.16s}
.btn-primary{background:var(--wine);color:#fff;box-shadow:0 6px 18px rgba(126,42,61,.28)}
.btn-primary:active{transform:scale(.98)}
.btn-green{background:var(--green);color:#fff;box-shadow:0 6px 18px rgba(79,138,107,.28)}
.btn-ghost{background:var(--ivory);color:var(--muted);border:1px solid var(--line)}
.btn:disabled{opacity:.55;cursor:not-allowed;box-shadow:none}
.btn.locked{background:var(--muted)!important;color:#fff!important;box-shadow:none}
.btn-row{display:flex;gap:10px;margin-top:16px}
.btn-row .btn{flex:1}
.btn-sm{padding:9px 14px;font-size:14px;border-radius:10px;width:auto}

/* ---------- seating ---------- */
.seat-head{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.unassigned-pool{background:linear-gradient(135deg,#FFF,#FCF6EC);border:1px dashed var(--gold);border-radius:var(--r);padding:13px;margin-bottom:16px}
.pool-title{font-size:14px;color:var(--gold);font-weight:600;margin-bottom:9px;display:flex;align-items:center;gap:6px}
.pool-chips{display:flex;flex-wrap:wrap;gap:7px}
.guest-pill{padding:7px 11px;border-radius:20px;background:var(--paper);border:1px solid var(--line);font-size:14px;display:flex;align-items:center;gap:6px;cursor:grab}
.guest-pill.dragging{opacity:.4}
.guest-pill .ps{font-size:12px;color:var(--muted)}

/* settings */

<header class="app">
  <div class="hd-row">
    <div>
      <div class="hd-names">吳宇童 <span class="hd-heart">❤</span> 劉懷筑 <span style="font-size:12px;background:var(--gold);color:var(--wine-deep);padding:2px 9px;border-radius:20px;font-weight:700;vertical-align:middle;margin-left:4px">高雄場</span></div>
      <div class="hd-sub" id="hdVenue">WEDDING CHECK-IN · 高雄場</div>
    </div>

<main id="main"></main>

  <button data-v="settings"><span class="ic">⚙️</span>設定</button>
</nav>

<div class="toast" id="toast"></div>

<script>
/* ============================================================
   設定區 — 填入你的 Firebase 設定即可開啟「雲端多人即時連線」
   留空則自動使用本機模式(同一台裝置、跨分頁可同步、可立即試用)
   ============================================================ */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyDNrIARClSaVkyFPzfGlKLlti3M8uTxScE",
  authDomain: "kaohsiung-wed-check-in.firebaseapp.com",
  databaseURL: "https://kaohsiung-wed-check-in-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "kaohsiung-wed-check-in",
  storageBucket: "kaohsiung-wed-check-in.firebasestorage.app",
  messagingSenderId: "419385129490",
  appId: "1:419385129490:web:7e1772bbd400ebe22236cb"
};
/* 進入系統的通行碼 — 請改成你要的密碼(工作人員輸入一次即記住) */
const ACCESS_CODE = "1003";
/* 清除資料的管理密碼 — 只有你和宇童知道(可改成你要的) */
const ADMIN_PASSWORD = "11010523";
const DB_ROOT = "weddingCheckinKH"; // 高雄場專用節點,與基隆場資料分開 // Firebase 資料根節點

/* ============================================================
   資料層:雲端 / 本機 雙模式統一介面
   ============================================================ */
const App = {
  mode: "local",
  state: { guests:{}, tables:{}, lottery:{winners:[]}, meta:{}, logs:[] },
  operator: "",
  fb: null,
  bc: null,
  LS_KEY: "wedding_checkin_kh_v1",
  listeners: [],

  cloudError: null,
  async init(){
    const valid = FIREBASE_CONFIG.databaseURL && !FIREBASE_CONFIG.databaseURL.includes("YOUR_");
    if(valid){
      try{ await this.initCloud(); this.mode="cloud"; }
      catch(e){
        this.cloudError = e && e.message ? e.message : String(e);
        console.warn("Firebase 連線失敗,改用本機模式:", this.cloudError);
        this.mode="local"; this.initLocal();
      }
    } else { this.cloudError="尚未填入 Firebase 設定"; this.mode="local"; this.initLocal(); }
    this.refreshModeUI();
  },

  /* ---- 本機模式 ---- */
  initLocal(){
    try{ const raw=localStorage.getItem(this.LS_KEY); if(raw) this.state=JSON.parse(raw); }catch(e){}
    if(!this.state.guests) this.state.guests={};
    if(!this.state.tables) this.state.tables={};
    if(!this.state.lottery) this.state.lottery={winners:[]};
    if(!this.state.meta) this.state.meta={};
    if(!this.state.logs) this.state.logs=[];
    try{
      this.bc=new BroadcastChannel("wedding_checkin_kh");
      this.bc.onmessage=(ev)=>{ this.state=ev.data; this.emit(); };
    }catch(e){}
    this.emit();
  },
  saveLocal(){
    try{ localStorage.setItem(this.LS_KEY,JSON.stringify(this.state)); }catch(e){}
    if(this.bc) this.bc.postMessage(this.state);
  },

  /* ---- 雲端模式 ---- */
  async initCloud(){
    try{
      await loadScript("https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js");
      await loadScript("https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js");
      await loadScript("https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js");
    }catch(e){ throw new Error("無法載入 Firebase 程式庫(請檢查網路連線)"); }
    if(typeof firebase==="undefined") throw new Error("Firebase 程式庫載入失敗");
    firebase.initializeApp(FIREBASE_CONFIG);

    // 匿名登入:使用者無感,但可讓安全規則限定「只有本 App 能讀寫」
    try{
      await firebase.auth().signInAnonymously();
    }catch(e){
      const code=(e&&e.code)||"";
      if(code.includes("operation-not-allowed"))
        throw new Error("請先到 Firebase → Authentication → 啟用「匿名」登入");
      throw new Error("匿名登入失敗:"+(e&&e.message?e.message:code));
    }

    this.fb=firebase.database();
    // 等待真正連上資料庫(.info/connected 不受規則限制)
    await new Promise((resolve,reject)=>{
      let settled=false;
      const to=setTimeout(()=>{ if(!settled){ settled=true;
        reject(new Error("連線逾時 — 多半是還沒在 Firebase 建立 Realtime Database")); } }, 7000);
      this.fb.ref(".info/connected").on("value",(snap)=>{
        if(snap.val()===true && !settled){ settled=true; clearTimeout(to); resolve(); }
      });
    });
    // 訂閱資料;讀取若被規則擋下會進 error callback
    this.fb.ref(DB_ROOT).on("value",(snap)=>{
      const v=snap.val()||{};
      this.state={ guests:v.guests||{}, tables:v.tables||{}, lottery:v.lottery||{winners:[]}, meta:v.meta||{}, logs:v.logs||[] };
      this.emit();
    },(err)=>{
      this.cloudError="資料庫拒絕讀取 — 請確認規則已設為 auth != null 並已發布";
      this.refreshModeUI(); this.emit();
    });
  },

  /* ---- 寫入 ---- */
  commit(pathFn){
    pathFn(this.state);
    if(this.mode==="cloud"){
      this.fb.ref(DB_ROOT).set(this.state).catch((err)=>{
        toast("⚠️ 儲存失敗:資料庫拒絕寫入");
        console.error("Firebase 寫入失敗",err);
      });
      this.emit();
    }
    else { this.saveLocal(); this.emit(); }
  },

  onChange(fn){ this.listeners.push(fn); },
  emit(){ this.listeners.forEach(f=>f()); },

  refreshModeUI(){
    const chip=document.getElementById("modeChip");
    const txt=document.getElementById("modeTxt");
    if(this.mode==="cloud"){ chip.classList.add("cloud"); txt.textContent="雲端連線"; }
    else { chip.classList.remove("cloud"); txt.textContent="本機模式"; }
    refreshOpUI();
  }
};

function refreshOpUI(){
  const chip=document.getElementById("opChip"), txt=document.getElementById("opTxt");
  if(!chip) return;
  if(App.operator){ chip.classList.remove("unset"); txt.textContent=App.operator; }
  else { chip.classList.add("unset"); txt.textContent="選擇身分"; }
}

function loadScript(src){
  return new Promise((res,rej)=>{
    const s=document.createElement("script");
    s.src=src; s.onload=res; s.onerror=rej; document.head.appendChild(s);
  });
}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);

/* ---- 操作紀錄 ---- */
function pushLog(s, action, type, target, detail){
  if(!s.logs) s.logs=[];
  s.logs.push({ ts:Date.now(), op:App.operator||"未具名", action, type, target:target||"", detail:detail||"" });
  if(s.logs.length>500) s.logs=s.logs.slice(-500);
}

/* ---- 操作人員識別 ---- */
const OP_KEY="wedding_operator";
function knownOperators(){
  const set=new Set();
  (App.state.meta.staffList||[]).forEach(n=>n&&set.add(n));
  (App.state.logs||[]).forEach(l=>l.op&&l.op!=="未具名"&&set.add(l.op));
  return [...set];
}
function showIdentify(){
  const ops=knownOperators();
  openSheet(`<div class="sheet-head"><div class="nm">請選擇操作人員</div>
    <div class="meta"><span>每筆操作會記下是誰執行,方便事後查核</span></div></div>
    ${ops.length?`<div class="field-lbl" style="margin-top:0">點選你的名字</div>
      <div class="id-quick">${ops.map(n=>`<button onclick="setOperator('${esc(n).replace(/'/g,"\\'")}')">${esc(n)}</button>`).join("")}</div>`:""}
    <div class="field-lbl">${ops.length?"或輸入新名字":"輸入你的名字"}</div>
    <input class="inp" id="opInput" placeholder="例如 宇童 / 報到組-小美" value="${esc(App.operator||"")}">
    <div class="btn-row"><button class="btn btn-ghost" onclick="closeSheet()">取消</button>
      <button class="btn btn-primary" onclick="setOperator(($('#opInput').value||'').trim())">確定</button></div>
    ${App.operator?`<button class="btn btn-ghost btn-sm" style="width:100%;margin-top:10px" onclick="setOperator('')">登出(清除身分)</button>`:""}`);
  setTimeout(()=>{ const i=$("#opInput"); if(i&&!ops.length) i.focus(); },100);
}
function setOperator(name){
  App.operator=name||"";
  try{ name?localStorage.setItem(OP_KEY,name):localStorage.removeItem(OP_KEY); }catch(e){}
  refreshOpUI(); closeSheet();
  if(name) toast(`目前操作人員:${name}`);
}
function requireOp(){
  if(App.operator) return true;
  toast("請先選擇操作身分才能操作");
  showIdentify();
  return false;
}

/* ============================================================
   工具
   ============================================================ */
const $=(s,el=document)=>el.querySelector(s);
function toast(msg){
  const t=document.getElementById("toast");
  t.textContent=msg; t.classList.add("show");
  clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove("show"),1900);
}
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));
const fmtMoney=n=>"$"+Number(n||0).toLocaleString("en-US");
function nowTime(){ const d=new Date(); return d.getHours().toString().padStart(2,"0")+":"+d.getMinutes().toString().padStart(2,"0"); }
function timeStr(ts){ if(!ts)return""; const d=new Date(ts); return d.getHours().toString().padStart(2,"0")+":"+d.getMinutes().toString().padStart(2,"0"); }

const guestList=()=>Object.entries(App.state.guests).map(([id,g])=>({id,...g}));
const tableList=()=>Object.entries(App.state.tables).map(([id,t])=>({id,...t})).sort((a,b)=>(a.order||0)-(b.order||0));
function tableName(id){ const t=App.state.tables[id]; return t?t.name:null; }
function guestsAtTable(id){ return guestList().filter(g=>g.table===id); }
function compNames(g){ return (Array.isArray(g.companions)?g.companions:[]).filter(n=>n&&n.trim()); }
function headCount(g){ return g.partySize||1; }

/* ============================================================
   視圖切換
   ============================================================ */
let currentView="checkin";
let modalEl=null;
document.querySelectorAll("#tabs button").forEach(b=>{
  b.onclick=()=>{ switchView(b.dataset.v); };
});
function switchView(v){
  currentView=v;
  document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("active",b.dataset.v===v));
  document.getElementById("fab").classList.toggle("hidden",v!=="guests");
  render();
}
function render(){
  if(modalEl) return; // 開著彈窗時不重繪底層,避免干擾輸入
  const m=document.getElementById("main");
  const fns={dashboard:viewDashboard,checkin:viewCheckin,seating:viewSeating,guests:viewGuests,lottery:viewLottery,audit:viewAudit,settings:viewSettings};
  m.innerHTML=`<div class="view">${fns[currentView]()}</div>`;
  if(currentView==="checkin") bindCheckin();
  if(currentView==="seating") bindSeating();
  if(currentView==="guests") bindGuests();
}
App.onChange(()=>{ if(!modalEl) render(); });

/* ============================================================
   戰況 Dashboard
   ============================================================ */
let giftVisible=false;
const GIFT_PASSWORD="05231101";
function unlockGift(){
  openSheet(`<div class="sheet-head"><div class="nm">🔒 檢視禮金累計</div>
    <div class="meta"><span>請輸入密碼後檢視</span></div></div>
    <div class="field-lbl" style="margin-top:0">密碼</div>
    <input class="inp" id="giftPw" type="password" inputmode="numeric" placeholder="請輸入密碼"
      onkeydown="if(event.key==='Enter')checkGiftPw()" style="text-align:center;letter-spacing:4px;font-size:20px">
    <div class="btn-row"><button class="btn btn-ghost" onclick="closeSheet()">取消</button>
      <button class="btn btn-primary" onclick="checkGiftPw()">解鎖</button></div>`);
  setTimeout(()=>{ const i=$("#giftPw"); if(i)i.focus(); },150);
}
function checkGiftPw(){
  const v=($("#giftPw")||{}).value||"";
  if(v===GIFT_PASSWORD){ giftVisible=true; closeSheet(); toast("已解鎖禮金累計"); }

/* 依桌次再依姓名排序 */
function byTableThenName(a,b){
  const ta=a.table?App.state.tables[a.table]:null, tb=b.table?App.state.tables[b.table]:null;
  if(!!ta!==!!tb) return ta?-1:1;
  if(ta&&tb&&(ta.order||0)!==(tb.order||0)) return (ta.order||0)-(tb.order||0);
  return (a.name||"").localeCompare(b.name||"","zh-Hant");
}
/* 點現況統計 → 看是哪些人 */
function openGuestListSheet(type){
  let gs=guestList(), title, empty;
  if(type==="arrived"){ gs=gs.filter(g=>g.arrived); title="✅ 已報到名單"; empty="還沒有人報到"; }
  else if(type==="pending"){ gs=gs.filter(g=>!g.arrived&&!g.giftOnly); title="⏳ 尚未報到名單"; empty="全部都到齊了 🎉"; }
  else { gs=gs.filter(g=>g.needsCookie); title="🍪 需給喜餅名單"; empty="沒有需要喜餅的賓客"; }
  if(type==="arrived") gs.sort((a,b)=>(b.arrivedTime||0)-(a.arrivedTime||0));
  else gs.sort(byTableThenName);
  const heads=gs.reduce((s,g)=>s+(g.partySize||1),0);
  const rows=gs.length?gs.map(g=>{
    const tn=g.table?tableName(g.table):"未排桌";
    const num=g.table?((tn.match(/\d+/)||[tn.slice(0,1)])[0]):"—";
    let right="";
    if(type==="arrived") right=`<div class="gl-sub" style="color:var(--green)">✓ ${timeStr(g.arrivedTime)}</div>${g.checkinBy?`<div class="gl-sub">${esc(g.checkinBy)}</div>`:""}`;
    else if(type==="pending") right=`<div class="gl-sub">${g.prepaid?"💰預收 "+fmtMoney(g.giftAmount):esc(tn)}</div>`;
    else right=g.cookieGiven?`<span class="tag" style="background:var(--green-soft);color:var(--green)">已交付</span>`:`<span class="tag cookie">未交付</span>`;
    return `<div class="gl-row">
      <div class="gl-tnum">${esc(num)}</div>
      <div class="gl-info"><div class="gl-name">${esc(g.name)}${g.partySize>1?`<span style="color:#7A5A82;font-size:13px"> +${g.partySize-1}</span>`:""}</div>
        <div class="gl-sub">${esc(tn)}${g.relation?" · "+esc(g.relation):""}${compNames(g).length?" · 👪 "+esc(compNames(g).slice(0,3).join("、")):""}</div></div>
      <div class="gl-right">${right}</div>
      ${type==="arrived"?`<button class="gl-cancel" onclick="cancelFromList('${g.id}')">取消報到</button>`:""}
    </div>`;
  }).join(""):`<div class="empty"><div class="e-ic">🕊️</div><div style="font-size:15px">${empty}</div></div>`;
  openSheet(`<div class="sheet-head"><div class="nm">${title}</div>
    <div class="meta"><span>共 ${heads} 人 · ${gs.length} 組</span>${type==="arrived"?"<span>最新報到在最上面</span>":""}</div></div>
    ${rows}
    <button class="btn btn-ghost" style="margin-top:14px" onclick="closeSheet()">關閉</button>`);
}
function cancelFromList(id){
  if(!requireOp())return;
  const g=App.state.guests[id]; if(!g)return;
  if(!confirm(`確定取消「${g.name}」的報到?`))return;
  App.commit(s=>{ const gg=s.guests[id]; if(!gg)return; gg.arrived=false; gg.arrivedTime=null; gg.checkinBy=null;
    gg.lastEditBy=App.operator; gg.lastEditTime=Date.now(); pushLog(s,"取消報到","un",gg.name,"從已報到名單取消"); });
  toast("已取消 "+g.name+" 的報到");
  openGuestListSheet("arrived");
}

function exportGiftCSV(){

  let csv="姓名,桌次,人數,禮金,報到人員,報到時間\n";

function doWalkin(mode){
  const name=($("#wkName").value||"").trim(); if(!name){ toast("請輸入姓名"); return; }
  if(!requireOp())return;
  const ps=Math.max(1,parseInt($("#wkParty").value)||1);
  const side=$("#wkSide").dataset.sel||"共同";
  const table=$("#wkTable").value||null;
  const need=$("#wkCookie")._v;
  const amt=Number(($("#wkGift")||{}).value)||0;
  const id=uid();
  App.commit(s=>{
    const g={name,side,relation:"現場新增",table,needsCookie:need,partySize:ps,arrived:false,giftAmount:0,cookieGiven:false,companions:[]};
    if(mode==="arrive"){ g.arrived=true; g.giftAmount=amt; g.arrivedTime=Date.now(); g.checkinBy=App.operator; }
    else if(mode==="prepaid"){ g.prepaid=true; g.giftAmount=amt; g.giftTime=Date.now(); }
    else if(mode==="giftonly"){ g.giftOnly=true; g.giftAmount=amt; g.giftTime=Date.now(); }
    g.lastEditBy=App.operator; g.lastEditTime=Date.now();
    s.guests[id]=g;
    const label=mode==="arrive"?"現場新增·報到":mode==="prepaid"?"現場新增·預收":mode==="giftonly"?"現場新增·未到收禮":"現場新增·加入名單";
    pushLog(s,label,mode==="pending"?"ed":"in",name,amt?`禮金 ${fmtMoney(amt)}`:ps+"人");
  });
  ciSearch=""; closeSheet();
  if(mode==="arrive"){ showCheckinSuccess(name, table?tableName(table):null); }
  else { toast(`已新增 ${name}`); }
  if(currentView==="checkin"){ const si=$("#ciSearchInput"); if(si){ si.value=""; si.focus(); } }
}

    <button class="chip ${ciFilter==='cookie'?'on':''}" data-f="cookie">待發喜餅<span class="b">${gs.filter(g=>g.needsCookie&&g.arrived&&!g.cookieGiven).length}</span></button>
  </div>
  <div id="ciList">${renderCiList()}</div>`;

function renderCiList(){
  let gs=guestList();
  const q=ciSearch.trim().toLowerCase();
  if(q) gs=gs.filter(g=>(g.name||"").toLowerCase().includes(q)||compNames(g).some(n=>n.toLowerCase().includes(q)));
  if(ciFilter==="pending") gs=gs.filter(g=>!g.arrived&&!g.giftOnly);
  if(ciFilter==="done") gs=gs.filter(g=>g.arrived);
  if(ciFilter==="giftonly") gs=gs.filter(g=>g.giftOnly&&!g.arrived);
  if(ciFilter==="prepaid") gs=gs.filter(g=>g.prepaid&&!g.arrived);
  if(ciFilter==="cookie") gs=gs.filter(g=>g.needsCookie&&g.arrived&&!g.cookieGiven);
  const _rank=g=>(!g.arrived&&!g.giftOnly)?0:(g.arrived?1:2);
  gs.sort((a,b)=>{
    const ra=_rank(a),rb=_rank(b);
    if(ra!==rb) return ra-rb;
    if(ra===0) return (a.name||"").localeCompare(b.name||"","zh-Hant");
    if(ra===1) return (b.arrivedTime||0)-(a.arrivedTime||0);
    return (b.giftTime||0)-(a.giftTime||0);
  });
  if(gs.length===0) return emptyBox("🔍","找不到賓客",q?`沒有符合「${esc(ciSearch)}」的賓客`:"換個篩選條件看看");
  return gs.map(g=>{
    const tn=g.table?tableName(g.table):null;
    const cn=compNames(g);
    return `<div class="g-card ${g.arrived?'done':g.giftOnly?'giftonly':g.prepaid?'prepaid':''}" onclick="openCheckin('${g.id}')">
      <div class="g-tbl"><div class="t-num">${tn?esc(tn.replace(/[^0-9]/g,'')||tn.slice(0,2)):"—"}</div><div class="t-lbl">${tn?"":"未排桌"}</div></div>
      <div class="g-info">
        <div class="g-name">
          <span class="g-nm">${esc(g.name)}</span>
          ${g.partySize>1?`<span class="tag" style="background:#F0E9F2;color:#7A5A82">👪 ${g.partySize}位</span>`:""}
          ${g.side?`<span class="tag side">${esc(g.side)}</span>`:""}
          ${g.relation?`<span class="tag">${esc(g.relation)}</span>`:""}
          ${cn.length?`<span class="tag">含 ${esc(cn.slice(0,3).join("、"))}${cn.length>3?"…":""}</span>`:""}
          ${g.needsCookie?`<span class="tag cookie">🍪 ${g.cookieGiven?"已領":"需喜餅"}</span>`:""}
        </div>
      </div>
      <div class="g-right">
        ${g.arrived
          ? `<div class="g-gift">${g.giftAmount?fmtMoney(g.giftAmount):"已到"}</div><div class="g-status ok">✓ ${timeStr(g.arrivedTime)}</div>`
          : g.giftOnly
            ? `<div class="g-gift">${g.giftAmount?fmtMoney(g.giftAmount):""}</div><div class="g-status" style="color:#B07A2E">🚫 未到·收禮</div>`
            : g.prepaid
              ? `<div class="g-gift" style="color:#2F6B54">${g.giftAmount?fmtMoney(g.giftAmount):""}</div><div class="g-status" style="color:#2F6B54">💰 已預收·待到</div>`
              : `<div class="g-status">輕觸報到</div>`}
      </div>
      <button class="g-edit" onclick="event.stopPropagation();openGuestEdit('${g.id}')" title="編輯資料">✎</button>
    </div>`;
  }).join("");
}
function bindCheckin(){
  const inp=$("#ciSearchInput");
  if(inp){
    inp.oninput=()=>{ ciSearch=inp.value; $("#ciList").innerHTML=renderCiList(); };
  }
  document.querySelectorAll(".filter-row .chip").forEach(c=>{
    c.onclick=()=>{ ciFilter=c.dataset.f; render(); setTimeout(()=>{const i=$("#ciSearchInput");if(i&&ciSearch){i.focus();}},0); };
  });
}

/* ---- 報到彈窗 ---- */
const QUICK_AMTS_1=[1200,1600,1800,2000,2200,2600,2800,3200,3600];
const QUICK_AMTS_2=[5200,6000,8000,8800,10000,12000];
function refreshGiftBtns(){
  const v=Number(($("#giftIn")||{}).value)||0;
  document.querySelectorAll(".qa").forEach(b=>b.classList.toggle("sel", v>0 && Number(b.dataset.amt)===v));
}
function showCheckinSuccess(name, tblName){
  const tnum = tblName ? ((String(tblName).match(/\d+/)||[""])[0]) : "";
  const el=document.createElement("div"); el.className="ci-success";
  el.innerHTML=`<div class="cis-card">
    <div class="cis-check">✓</div>
    <div class="cis-title">報到成功</div>
    <div class="cis-name">${esc(name)}</div>
    ${tblName?`<div class="cis-table"><span class="cis-tlabel">請入座</span><span class="cis-tnum">${tnum||esc(tblName)}</span><span class="cis-tunit">桌</span></div>`:`<div class="cis-notable">尚未排桌</div>`}
    <div class="cis-hint">輕觸關閉</div>
  </div>`;
  el.onclick=()=>{ if(el.parentNode) el.remove(); };
  document.body.appendChild(el);
  setTimeout(()=>{ if(el.parentNode) el.remove(); }, 3000);
}
function openCheckin(id){
  const g=App.state.guests[id]; if(!g)return;
  let gift=g.giftAmount||"";
  let cookieGiven=!!g.cookieGiven;
  const tn=g.table?tableName(g.table):null;

  openSheet(`
    <div class="sheet-head">
      <div class="nm">${esc(g.name)}</div>
      <div class="meta">
        ${tn?`<span>🪑 ${esc(tn)}</span>`:`<span>未排桌</span>`}
        ${g.side?`<span>${esc(g.side)}</span>`:""}
        ${g.relation?`<span>${esc(g.relation)}</span>`:""}
        ${g.partySize>1?`<span>${g.partySize} 位</span>`:""}
      </div>
    </div>

    ${g.checkinBy?`<div class="who-stamp">本筆由 <b>${esc(g.checkinBy)}</b> 於 ${timeStr(g.arrivedTime)} 報到${g.lastEditBy&&g.lastEditBy!==g.checkinBy?` · 最後修改 ${esc(g.lastEditBy)}`:""}</div>`:""}

    ${g.partySize>1?`<div class="party-box">
      <div class="pb-title">👪 本帖共 ${g.partySize} 位 · 一起報到</div>
      ${(Array.isArray(g.companions)?g.companions:[]).filter(c=>c&&c.trim()).length?`<div class="pb-list">
        ${(Array.isArray(g.companions)?g.companions:[]).filter(c=>c&&c.trim()).map(c=>`<span class="pb-name">${esc(c)}</span>`).join("")}
      </div>`:""}
    </div>`:""}

    <div class="cookie-banner ${g.needsCookie?'need':'no'}">
      <span class="cb-ic">${g.needsCookie?"🍪":"🚫"}</span>
      <div class="cb-t">
        <b>${g.needsCookie?"這位賓客要給喜餅":"這位賓客不需喜餅"}</b>
        <span>${g.needsCookie?"請於報到時交付喜餅":"報到時不必準備"}</span>
      </div>
      ${g.needsCookie?`<div class="toggle ${cookieGiven?'on':''}" id="ckTog"></div>`:""}
    </div>
    ${g.needsCookie?`<div style="text-align:center;font-size:14px;color:var(--muted);margin:-8px 0 4px" id="ckLbl">${cookieGiven?"✓ 喜餅已交付":"切換上方開關標記已交付"}</div>`:""}

    <div class="field-lbl">禮金金額${g.partySize>1?' (整帖一份)':''}</div>
    <div class="gift-input"><span class="ntd">NT$</span>
      <input id="giftIn" type="number" inputmode="numeric" placeholder="0" value="${gift}">
    </div>
    <div class="quick-amt">
      ${QUICK_AMTS_1.map(a=>`<button class="qa" data-amt="${a}" onclick="setGift(${a})">${a.toLocaleString()}</button>`).join("")}
    </div>
    <div class="quick-divider"></div>
    <div class="quick-amt">
      ${QUICK_AMTS_2.map(a=>`<button class="qa" data-amt="${a}" onclick="setGift(${a})">${a.toLocaleString()}</button>`).join("")}
      <button onclick="setGift(0)" style="color:var(--muted)">清除</button>
    </div>

    ${g.prepaid&&!g.arrived?`<div class="cookie-banner" style="background:#EAF3F0;border-color:#BEDDD1;color:#2F6B54;margin-top:4px">
      <span class="cb-ic">💰</span>
      <div class="cb-t"><b>禮金已預收 ${fmtMoney(g.giftAmount)}</b><span>本人會到,現場點「完成報到」即可</span></div>
    </div>`:""}

    <div class="btn-row">
      ${g.arrived
        ? `<button class="btn btn-ghost" onclick="undoCheckin('${id}')">取消報到</button>
           <button class="btn btn-green" id="ciConfirmBtn" onclick="confirmCheckin('${id}')">💾 更新</button>`
        : g.giftOnly
          ? `<button class="btn btn-ghost" onclick="undoGiftOnly('${id}')" style="color:var(--red)">清除未到禮金</button>
             <button class="btn btn-primary" id="ciConfirmBtn" onclick="confirmCheckin('${id}')">💾 更新</button>`
          : g.prepaid
            ? `<button class="btn btn-ghost" onclick="undoPrepay('${id}')" style="color:var(--red)">清除預收</button>
               <button class="btn btn-primary" id="ciConfirmBtn" onclick="confirmCheckin('${id}')">✓ 完成報到</button>`
            : `<button class="btn btn-green" onclick="doPrepay('${id}')">💰 預收禮金</button>
               <button class="btn btn-primary" id="ciConfirmBtn" onclick="confirmCheckin('${id}')">✓ 完成報到</button>`}
    </div>
    ${!g.arrived&&!g.giftOnly&&!g.prepaid?`<button class="btn btn-ghost" style="width:100%;margin-top:10px" onclick="closeSheet()">取消</button>`:""}
    ${!g.arrived&&!g.prepaid?`<div class="cookie-banner ${g.giftOnly?'need':'no'}" id="nsRow" style="margin-top:16px">
      <span class="cb-ic">🚫</span>
      <div class="cb-t"><b>不克出席 · 僅收禮金</b><span>不算到場人數,禮金仍計入總額</span></div>
      <div class="toggle ${g.giftOnly?'on':''}" id="nsTog"></div>
    </div>`:""}
  `);

  // 狀態:喜餅鎖 + 不克出席(僅收禮金)
  let noShow = !!g.giftOnly;
  const confirmBtn=$("#ciConfirmBtn");
  const baseLabel = (g.arrived||g.giftOnly) ? "💾 更新" : "✓ 完成報到";
  function updateModalState(){
    if(!confirmBtn) return;
    const locked = g.needsCookie && !cookieGiven && !noShow;
    confirmBtn.disabled = locked;
    confirmBtn.classList.toggle("locked", locked);
    confirmBtn.textContent = locked ? "🔒 開喜餅開關後可報到" : (noShow ? "登錄禮金(未到)" : baseLabel);
  }
  const tog=$("#ckTog");
  if(tog){ tog.onclick=()=>{ cookieGiven=!cookieGiven; tog.classList.toggle("on",cookieGiven);
    const l=$("#ckLbl"); if(l) l.textContent=cookieGiven?"✓ 喜餅已交付":"切換上方開關標記已交付"; updateModalState(); }; }
  const nsTog=$("#nsTog"), nsRow=$("#nsRow");
  if(nsTog){ nsTog.onclick=()=>{ noShow=!noShow; nsTog.classList.toggle("on",noShow);
    if(nsRow){ nsRow.classList.toggle("need",noShow); nsRow.classList.toggle("no",!noShow); } updateModalState(); }; }
  updateModalState();
  window.setGift=(a)=>{ $("#giftIn").value=a||""; refreshGiftBtns(); };
  const giftInEl=$("#giftIn");
  if(giftInEl){ giftInEl.oninput=refreshGiftBtns; }
  refreshGiftBtns();
  window.confirmCheckin=(gid)=>{
    if(!App.operator){ toast("請先在右上角選擇操作人員"); showIdentify(); return; }
    const ns=$("#nsTog")&&$("#nsTog").classList.contains("on");
    const gLock=App.state.guests[gid];
    const wasArrived=!!(gLock&&gLock.arrived);
    if(!ns && gLock && gLock.needsCookie){ const on=$("#ckTog")&&$("#ckTog").classList.contains("on"); if(!on){ toast("請先滑開喜餅開關(標記已交付)才能完成報到"); return; } }
    const amt=Number($("#giftIn").value)||0;
    const cg=$("#ckTog")?$("#ckTog").classList.contains("on"):!!App.state.guests[gid].cookieGiven;
    App.commit(s=>{
      const gg=s.guests[gid];
      if(ns){
        gg.giftOnly=true; gg.arrived=false; gg.arrivedTime=null; gg.checkinBy=null;
        gg.giftAmount=amt; gg.cookieGiven=cg; gg.giftTime=Date.now();
        gg.lastEditBy=App.operator; gg.lastEditTime=Date.now();
        pushLog(s,"未到收禮","in",gg.name,`禮金 ${fmtMoney(amt)}(不克出席)`);
      } else {
        const first=!gg.arrived;
        gg.arrived=true; gg.giftOnly=false; gg.prepaid=false; gg.giftAmount=amt; gg.cookieGiven=cg;
        if(first||!gg.arrivedTime){ gg.arrivedTime=Date.now(); gg.checkinBy=App.operator; }
        gg.lastEditBy=App.operator; gg.lastEditTime=Date.now();
        const detail=`禮金 ${fmtMoney(amt)}${gg.needsCookie?(cg?" · 喜餅已交付":" · 喜餅未交付"):""}`;
        pushLog(s, first?"報到":"修改報到", first?"in":"ed", gg.name, detail);
      }
    });
    const gg2=App.state.guests[gid];
    const _nm=gg2?gg2.name:"";
    const _tn=gg2&&gg2.table?tableName(gg2.table):null;
    ciSearch=""; closeSheet();
    if(ns){ toast(`已登錄 ${_nm} 未到禮金`); }
    else if(!wasArrived){ showCheckinSuccess(_nm,_tn); }
    else { toast(`已更新 ${_nm}`); }
    if(currentView==="checkin"){ const si=$("#ciSearchInput"); if(si){ si.value=""; si.focus(); } }
  };
  window.undoCheckin=(gid)=>{
    if(!App.operator){ toast("請先在右上角選擇操作人員"); showIdentify(); return; }
    App.commit(s=>{ const gg=s.guests[gid]; gg.arrived=false; gg.arrivedTime=null; gg.checkinBy=null;
      gg.lastEditBy=App.operator; gg.lastEditTime=Date.now();
      pushLog(s,"取消報到","un",gg.name,""); });
    closeSheet(); toast("已取消報到");
  };
  window.undoGiftOnly=(gid)=>{
    if(!App.operator){ toast("請先在右上角選擇操作人員"); showIdentify(); return; }
    App.commit(s=>{ const gg=s.guests[gid]; gg.giftOnly=false; gg.giftAmount=0; gg.giftTime=null;
      gg.lastEditBy=App.operator; gg.lastEditTime=Date.now();
      pushLog(s,"清除未到禮金","un",gg.name,""); });
    closeSheet(); toast("已清除未到禮金");
  };
  window.doPrepay=(gid)=>{
    if(!App.operator){ toast("請先在右上角選擇操作人員"); showIdentify(); return; }
    const amt=Number($("#giftIn").value)||0;
    const cg=$("#ckTog")?$("#ckTog").classList.contains("on"):!!App.state.guests[gid].cookieGiven;
    App.commit(s=>{ const gg=s.guests[gid];
      gg.prepaid=true; gg.giftOnly=false; gg.arrived=false; gg.arrivedTime=null; gg.checkinBy=null;
      gg.giftAmount=amt; gg.cookieGiven=cg; gg.giftTime=Date.now();
      gg.lastEditBy=App.operator; gg.lastEditTime=Date.now();
      pushLog(s,"預收禮金","in",gg.name,`禮金 ${fmtMoney(amt)}(會到,待報到)`); });
    const _nm=App.state.guests[gid]?App.state.guests[gid].name:"";
    ciSearch=""; closeSheet(); toast(`已登錄 ${_nm} 預收禮金`);
    if(currentView==="checkin"){ const si=$("#ciSearchInput"); if(si){ si.value=""; si.focus(); } }
  };
  window.undoPrepay=(gid)=>{
    if(!App.operator){ toast("請先在右上角選擇操作人員"); showIdentify(); return; }
    App.commit(s=>{ const gg=s.guests[gid]; gg.prepaid=false; gg.giftAmount=0; gg.giftTime=null;
      gg.lastEditBy=App.operator; gg.lastEditTime=Date.now();
      pushLog(s,"清除預收","un",gg.name,""); });
    closeSheet(); toast("已清除預收");
  };
}

let dragGuestId=null;
function viewSeating(){
  const tbls=tableList();
  const unassigned=guestList().filter(g=>!g.table);
  return `
  <h2 class="section-title"><span class="eyebrow">Seating</span> 桌次安排</h2>

    <button class="btn btn-primary btn-sm" onclick="openTableEdit()">＋ 新增桌次</button>

      <div class="st-head">

function bindSeating(){}
function dragStart(e,id){ dragGuestId=id; e.target.classList.add("dragging"); }
function dragEnd(e){ e.target.classList.remove("dragging"); }
function dragOver(e,el){ e.preventDefault(); el.classList.add("over"); }
function dropToTable(e,tid){ e.preventDefault(); document.querySelectorAll(".seat-table").forEach(x=>x.classList.remove("over"));
  if(dragGuestId){ App.commit(s=>{ s.guests[dragGuestId].table=tid; }); dragGuestId=null; } }
function dropToPool(e){ e.preventDefault(); if(dragGuestId){ App.commit(s=>{ s.guests[dragGuestId].table=null; }); dragGuestId=null; } }
function unassign(id){ App.commit(s=>{ s.guests[id].table=null; }); }
function assignPrompt(id){
  const tbls=tableList();
  if(!tbls.length){ toast("請先新增桌次"); return; }
  openSheet(`<div class="sheet-head"><div class="nm">${esc(App.state.guests[id].name)}</div><div class="meta"><span>選擇要安排的桌次</span></div></div>
    ${tbls.map(t=>{ const heads=guestsAtTable(t.id).reduce((s,g)=>s+(g.partySize||1),0);
      return `<button class="btn btn-ghost" style="justify-content:space-between;margin-bottom:8px" onclick="doAssign('${id}','${t.id}')">
        <span>${esc(t.name)}</span><span style="color:var(--muted);font-size:14px">${heads}${t.capacity?'/'+t.capacity:''} 人</span></button>`;}).join("")}
    <button class="btn btn-ghost" style="margin-top:6px" onclick="closeSheet()">取消</button>`);
}
function doAssign(gid,tid){ App.commit(s=>{ s.guests[gid].table=tid; }); closeSheet(); toast("已安排桌次"); }

function quickAddTables(){
  openSheet(`<div class="sheet-head"><div class="nm">快速建桌</div><div class="meta"><span>一次建立多桌</span></div></div>
    <div class="field-lbl">桌數</div><input class="inp" id="qtCount" type="number" inputmode="numeric" value="10" placeholder="例如 12">
    <div class="field-lbl">名稱格式</div>
    <div class="seg" id="qtFmt"><button class="on" data-f="第N桌">第 N 桌</button><button data-f="N">N 號桌</button><button data-f="A">英文 A,B,C</button></div>
    <div class="field-lbl">每桌人數上限(可留空)</div><input class="inp" id="qtCap" type="number" inputmode="numeric" value="10" placeholder="例如 10">
    <div class="btn-row"><button class="btn btn-ghost" onclick="closeSheet()">取消</button><button class="btn btn-primary" onclick="doQuickAdd()">建立</button></div>`);
  segBind("qtFmt");
}
function doQuickAdd(){
  if(!requireOp())return;
  const n=Math.min(60,Math.max(1,parseInt($("#qtCount").value)||0));
  const fmt=$("#qtFmt").dataset.sel||"第N桌";
  const cap=Number($("#qtCap").value)||null;
  App.commit(s=>{
    const base=Object.keys(s.tables).length;
    for(let i=1;i<=n;i++){
      const id=uid();
      let name = fmt==="第N桌"?`第 ${i} 桌` : fmt==="N"?`${i} 號桌` : `${String.fromCharCode(64+i)} 桌`;
      s.tables[id]={name,capacity:cap,order:base+i,note:""};
    }
  });
  closeSheet(); toast(`已建立 ${n} 桌`);
}
function openTableEdit(id){
  const t=id?App.state.tables[id]:{name:"",capacity:10,note:""};
  openSheet(`<div class="sheet-head"><div class="nm">${id?"編輯桌次":"新增桌次"}</div></div>
    <div class="field-lbl">桌次名稱</div><input class="inp" id="tName" value="${esc(t.name)}" placeholder="例如 第 1 桌 / 主桌 / 男方親友">
    <div class="field-lbl">人數上限(可留空)</div><input class="inp" id="tCap" type="number" inputmode="numeric" value="${t.capacity||""}" placeholder="例如 10">
    <div class="field-lbl">備註(可留空)</div><input class="inp" id="tNote" value="${esc(t.note||"")}" placeholder="例如 靠舞台 / 兒童椅">
    <div class="btn-row">
      ${id?`<button class="btn btn-ghost" onclick="delTable('${id}')" style="color:var(--red)">刪除</button>`:`<button class="btn btn-ghost" onclick="closeSheet()">取消</button>`}
      <button class="btn btn-primary" onclick="saveTable('${id||""}')">儲存</button>
    </div>`);
}
function saveTable(id){
  if(!requireOp())return;
  const name=$("#tName").value.trim(); if(!name){ toast("請輸入桌次名稱"); return; }
  const cap=Number($("#tCap").value)||null; const note=$("#tNote").value.trim();
  App.commit(s=>{
    if(id){ Object.assign(s.tables[id],{name,capacity:cap,note}); }
    else { s.tables[uid()]={name,capacity:cap,note,order:Object.keys(s.tables).length+1}; }
  });
  closeSheet(); toast("已儲存");
}
function delTable(id){
  if(!requireOp())return;
  if(!confirm("刪除這桌?該桌賓客會回到待排桌區。")) return;
  App.commit(s=>{ guestList().forEach(g=>{ if(g.table===id) s.guests[g.id].table=null; }); delete s.tables[id]; });
  closeSheet(); toast("已刪除桌次");
}

   賓客管理 Guests
   ============================================================ */
let gAdmSearch="";
let gAdmSort="table";
function viewGuests(){
  return `
  <h2 class="section-title"><span class="eyebrow">Guests</span> 賓客名單 <span style="font-family:'Cormorant Garamond';color:var(--muted);font-size:18px">${guestList().length}</span></h2>
  <div class="seat-head" style="margin-bottom:10px">
    <button class="btn btn-ghost btn-sm" onclick="openMerge()">🔗 合併家人</button>
    <button class="btn btn-ghost btn-sm" onclick="openBulkImport()">📋 批次匯入</button>
    <button class="btn btn-ghost btn-sm" onclick="exportCSV()">⬇ 匯出名單</button>
  </div>
  <div class="seg" style="margin-bottom:10px">
    <button class="${gAdmSort==='table'?'on':''}" onclick="gAdmSort='table';render()">依桌次排序</button>
    <button class="${gAdmSort==='name'?'on':''}" onclick="gAdmSort='name';render()">依姓名排序</button>
  </div>
  <div class="searchbar"><span class="si">🔍</span><input id="gAdmSearch" placeholder="搜尋姓名…" value="${esc(gAdmSearch)}" autocomplete="off"></div>
  <div id="gAdmList">${renderGuestRows()}</div>`;
}
function renderGuestRows(){
  let gs=guestList();
  const q=gAdmSearch.trim().toLowerCase();
  if(q) gs=gs.filter(g=>(g.name||"").toLowerCase().includes(q)||compNames(g).some(c=>c.toLowerCase().includes(q)));
  if(gAdmSort==="table"){
    gs.sort((a,b)=>{
      const ta=a.table?App.state.tables[a.table]:null, tb=b.table?App.state.tables[b.table]:null;
      if(!!ta!==!!tb) return ta?-1:1;
      if(ta&&tb&&(ta.order||0)!==(tb.order||0)) return (ta.order||0)-(tb.order||0);
      return (a.name||"").localeCompare(b.name||"","zh-Hant");
    });
  } else {
    gs.sort((a,b)=>(a.name||"").localeCompare(b.name||"","zh-Hant"));
  }

/* ---- 合併家人:把分開的數筆併成一組(主賓客＋同行人) ---- */
let mergeSel=[];
function openMerge(){ mergeSel=[]; openSheet(mergeSheetHTML()); }
function mergeSheetHTML(){
  let gs=guestList();
  gs.sort((a,b)=>{ if(!!a.table!==!!b.table)return a.table?-1:1;
    if(a.table&&b.table&&a.table!==b.table)return (tableName(a.table)||"").localeCompare(tableName(b.table)||"","zh-Hant");
    return (a.name||"").localeCompare(b.name||"","zh-Hant"); });
  return `<div class="sheet-head"><div class="nm">合併家人成一組</div>
    <div class="meta"><span>勾選同住家人,第一位為代表(主賓客),其餘變同行人</span></div></div>
    <div class="searchbar" style="margin-bottom:10px"><span class="si">🔍</span>
      <input id="mgSearch" placeholder="搜尋姓名…" oninput="filterMergeRows(this.value)"></div>
    <div id="mergeList" style="max-height:44vh;overflow:auto;border:1px solid var(--line);border-radius:12px;margin-bottom:12px">
      ${gs.map(g=>{ const search=(g.name+" "+compNames(g).join(" ")).toLowerCase();
        return `<label class="mg-row" data-id="${g.id}" data-search="${esc(search)}" style="display:flex;align-items:center;gap:11px;padding:11px 13px;border-bottom:1px solid var(--line)">
          <input type="checkbox" onchange="toggleMerge('${g.id}')" style="width:21px;height:21px;accent-color:var(--wine);flex-shrink:0">
          <span style="flex:1;min-width:0"><span style="font-weight:500">${esc(g.name)}</span>${g.partySize>1?`<span style="color:#7A5A82;font-size:13px"> +${g.partySize-1}</span>`:""}
            <span style="color:var(--muted);font-size:13px;display:block">${g.table?esc(tableName(g.table)):"未排桌"}${g.side?" · "+esc(g.side):""}</span></span>
          <span class="mg-badge" data-id="${g.id}"></span>
        </label>`; }).join("")}
    </div>
    <div id="mergeFooter" style="text-align:center;font-size:14px;color:var(--muted);margin-bottom:12px">已勾選 0 位(至少選 2 位)</div>
    <div class="btn-row"><button class="btn btn-ghost" onclick="closeSheet()">取消</button>
      <button class="btn btn-primary" id="mergeBtn" onclick="doMerge()" disabled style="opacity:.45">合併成一組</button></div>`;
}
function filterMergeRows(q){
  q=(q||"").trim().toLowerCase();
  document.querySelectorAll("#mergeList .mg-row").forEach(r=>{
    r.style.display=(!q||(r.dataset.search||"").includes(q))?"":"none";
  });
}
function toggleMerge(id){ const i=mergeSel.indexOf(id); if(i>=0)mergeSel.splice(i,1); else mergeSel.push(id); updateMergeUI(); }
function updateMergeUI(){
  document.querySelectorAll("#mergeList .mg-badge").forEach(b=>{
    const idx=mergeSel.indexOf(b.dataset.id);
    if(idx===0){ b.textContent="代表"; b.className="tag mg-badge"; b.style.cssText="background:var(--wine);color:#fff"; }
    else if(idx>0){ b.textContent="同行"+idx; b.className="tag mg-badge"; b.style.cssText=""; }
    else { b.textContent=""; b.className="mg-badge"; b.style.cssText=""; }
  });
  const heads=mergeSel.reduce((s,id)=>s+(App.state.guests[id]?App.state.guests[id].partySize||1:0),0);
  const f=document.getElementById("mergeFooter");
  if(f) f.innerHTML=mergeSel.length>=2
    ? `代表:<b style="color:var(--wine)">${esc(App.state.guests[mergeSel[0]].name)}</b> · 合併後整組 <b>${heads}</b> 位`
    : `已勾選 ${mergeSel.length} 位(至少選 2 位)`;
  const btn=document.getElementById("mergeBtn");
  if(btn){ const ok=mergeSel.length>=2; btn.disabled=!ok; btn.style.opacity=ok?"1":"0.45"; }
}
function doMerge(){
  if(!requireOp())return;
  if(mergeSel.length<2)return;
  const [mainId,...rest]=mergeSel;
  const mainName=App.state.guests[mainId]?App.state.guests[mainId].name:"";
  App.commit(s=>{
    const main=s.guests[mainId]; if(!main)return;
    if(!Array.isArray(main.companions)) main.companions=[];
    // 主賓客原本若只有人數沒名字,補成未具名同行
    let mainExtra=(main.partySize||1)-1-main.companions.length; if(mainExtra<0)mainExtra=0;
    for(let k=0;k<mainExtra;k++) main.companions.push("");
    rest.forEach(rid=>{ const o=s.guests[rid]; if(!o)return;
      main.companions.push(o.name);
      const oc=Array.isArray(o.companions)?o.companions:[];
      oc.forEach(c=>main.companions.push(c));
      let oExtra=(o.partySize||1)-1-oc.length; if(oExtra<0)oExtra=0;
      for(let k=0;k<oExtra;k++) main.companions.push("");
      if(o.needsCookie) main.needsCookie=true;
      if(o.giftAmount) main.giftAmount=(main.giftAmount||0)+Number(o.giftAmount||0);
      if(o.arrived) main.arrived=true;
      delete s.guests[rid];
    });
    main.partySize=1+main.companions.length;
    pushLog(s,"合併家人","ed",main.name,`併入 ${rest.length} 位 → 整組 ${main.partySize} 位`);
  });
  closeSheet(); toast(`已合併為一組:${mainName} 等 ${rest.length+1} 位`);
}

function openBulkImport(){
  openSheet(`<div class="sheet-head"><div class="nm">批次匯入名單</div><div class="meta"><span>每行一位賓客</span></div></div>
    <div class="note">格式(用逗號分隔,只有姓名也可以):<br><b>姓名, 桌次名稱, 男方/女方, 人數, 喜餅(Y/N)</b><br>
    例如:<br>王大明, 第1桌, 男方, 2, Y<br>陳阿姨, 第3桌, 女方, 1, N<br>李同學</div>
    <textarea class="inp" id="bulkTxt" style="height:170px;margin-top:12px;font-family:ui-monospace,monospace;font-size:14px" placeholder="王大明, 第1桌, 男方, 2, Y&#10;陳阿姨, 第3桌, 女方&#10;李同學"></textarea>
    <div class="btn-row"><button class="btn btn-ghost" onclick="closeSheet()">取消</button><button class="btn btn-primary" onclick="doBulkImport()">匯入</button></div>`);
}
function doBulkImport(){
  if(!requireOp())return;
  const lines=$("#bulkTxt").value.split("\n").map(l=>l.trim()).filter(Boolean);
  if(!lines.length){ toast("沒有可匯入的資料"); return; }
  let count=0;
  App.commit(s=>{
    const findTable=(nm)=>{ if(!nm)return null; const f=Object.entries(s.tables).find(([id,t])=>t.name===nm); 
      if(f)return f[0]; const id=uid(); s.tables[id]={name:nm,capacity:null,order:Object.keys(s.tables).length+1,note:""}; return id; };
    lines.forEach(line=>{
      const p=line.split(/[,，]/).map(x=>x.trim());
      const name=p[0]; if(!name)return;
      const table=p[1]?findTable(p[1]):null;
      const side=/男/.test(p[2]||"")?"男方":/女/.test(p[2]||"")?"女方":"共同";
      const partySize=Math.max(1,parseInt(p[3])||1);
      const needsCookie=/^[Yy是要]/.test(p[4]||"");
      s.guests[uid()]={name,side,partySize,relation:"",table,needsCookie,arrived:false,giftAmount:0,cookieGiven:false};
      count++;
    });
    pushLog(s,"批次匯入","ed","",`新增 ${count} 位賓客`);
  });
  closeSheet(); toast(`已匯入 ${count} 位賓客`);
}
function exportCSV(){
  const gs=guestList();
  if(!gs.length){ toast("名單是空的"); return; }
  let csv="姓名,桌次,男女方,人數,喜餅,已報到,禮金,喜餅已領,報到時間\n";
  gs.forEach(g=>{
    csv+=[g.name,g.table?tableName(g.table):"",g.side||"",g.partySize||1,g.needsCookie?"Y":"N",
      g.arrived?"是":"否",g.giftAmount||0,g.cookieGiven?"是":"否",g.arrivedTime?timeStr(g.arrivedTime):""].map(x=>`"${String(x).replace(/"/g,'""')}"`).join(",")+"\n";
  });
  downloadFile("婚禮賓客名單.csv","\uFEFF"+csv,"text/csv");
  toast("已匯出 CSV");
}

function viewLottery(){

function lotEligible(){
  const won=new Set((App.state.lottery.winners||[]).map(w=>w.guestId));
  return guestList().filter(g=>(lotPool==="all"||g.arrived)&&!won.has(g.id));
}
function segSelf(btn){ btn.parentElement.querySelectorAll("button").forEach(b=>b.classList.remove("on")); btn.classList.add("on");
  const pc=$("#poolCount"); if(pc) pc.textContent=lotEligible().length; }
function drawWinner(){
  if(lotRolling) return;
  const pool=lotEligible();
  if(!pool.length){ toast(lotPool==="arrived"?"目前沒有已報到的賓客可抽":"沒有可抽的賓客"); return; }
  lotRolling=true;
  const nameEl=$("#lotNameBig"), subEl=$("#lotSub"), btn=$("#drawBtn");
  btn.textContent="抽獎中…"; nameEl.classList.add("rolling"); subEl.textContent="🎲 抽選中…";
  let ticks=0; const total=28+Math.floor(Math.random()*8);
  const spin=()=>{
    nameEl.textContent=pool[Math.floor(Math.random()*pool.length)].name;
    ticks++;
    if(ticks<total){ setTimeout(spin, 50+ticks*4); }
    else{
      const winner=pool[Math.floor(Math.random()*pool.length)];
      nameEl.textContent=winner.name; nameEl.classList.remove("rolling");
      subEl.textContent="🎉 恭喜中獎!"; lastWinnerName=winner.name;
      App.commit(s=>{ if(!s.lottery.winners)s.lottery.winners=[]; s.lottery.winners.push({guestId:winner.id,name:winner.name,prize:lotPrize,time:Date.now()}); pushLog(s,"抽獎中獎","lt",winner.name,lotPrize); });

      lotRolling=false; toast(`🎉 ${winner.name} 中獎!`);
    }
  };
  spin();
}

function drawProjection(){
  if(lotRolling) return;
  const pool=lotEligible();
  if(!pool.length){ $("#pjSub").textContent="沒有可抽的賓客"; return; }
  lotRolling=true;
  const nameEl=$("#pjName"), subEl=$("#pjSub"), btn=$("#pjBtn");
  btn.textContent="抽獎中…"; nameEl.classList.add("rolling"); subEl.textContent="🎲 抽選中…";
  let ticks=0; const total=30+Math.floor(Math.random()*8);
  const spin=()=>{
    nameEl.textContent=pool[Math.floor(Math.random()*pool.length)].name; ticks++;
    if(ticks<total){ setTimeout(spin,55+ticks*4.5); }
    else{
      const winner=pool[Math.floor(Math.random()*pool.length)];
      nameEl.textContent=winner.name; nameEl.classList.remove("rolling");
      subEl.textContent="🎉 恭喜中獎!"; lastWinnerName=winner.name; btn.textContent="🎲 再抽一位";
      App.commit(s=>{ if(!s.lottery.winners)s.lottery.winners=[]; s.lottery.winners.push({guestId:winner.id,name:winner.name,prize:lotPrize,time:Date.now()}); pushLog(s,"抽獎中獎","lt",winner.name,lotPrize); });
      fireConfetti($("#pjCanvas"), $("#projEl"));
      lotRolling=false;
    }
  };
  spin();
}
function fireConfetti(canvas, parent){
  if(!canvas) return;
  const W=canvas.width=parent.clientWidth, H=canvas.height=parent.clientHeight;
  const ctx=canvas.getContext("2d");
  const cols=["#C2A05C","#E6D5AE","#7E2A3D","#F4E4C1","#fff"];
  const parts=Array.from({length:120},()=>({x:W/2+(Math.random()-.5)*120,y:H*.35,vx:(Math.random()-.5)*11,vy:Math.random()*-13-4,
    s:Math.random()*7+4,c:cols[Math.floor(Math.random()*cols.length)],r:Math.random()*6,vr:(Math.random()-.5)*.4}));
  let f=0;
  (function anim(){
    ctx.clearRect(0,0,W,H); f++;
    parts.forEach(p=>{ p.vy+=.32; p.x+=p.vx; p.y+=p.vy; p.r+=p.vr;
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r); ctx.fillStyle=p.c; ctx.globalAlpha=Math.max(0,1-f/110);
      ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*1.5); ctx.restore(); });
    if(f<110) requestAnimationFrame(anim); else ctx.clearRect(0,0,W,H);
  })();
}

let logFilter="all", logSearch="";
const LOG_TYPES={all:"全部",checkin:"報到 / 取消",ed:"賓客異動",lt:"抽獎"};
const LOG_MATCH={all:()=>true, checkin:l=>l.type==="in"||l.type==="un", ed:l=>l.type==="ed", lt:l=>l.type==="lt"};
function viewAudit(){
  const logs=(App.state.logs||[]);
  return `

  <div class="note" style="margin-bottom:12px">每筆報到、禮金、喜餅與賓客異動都會記下「誰、幾點、做了什麼」。若有人登錯,可在這裡查到是哪位人員、何時操作。</div>
  <div class="searchbar"><span class="si">🔍</span>
    <input id="logSearch" placeholder="搜尋賓客或操作人員…" value="${esc(logSearch)}"
      oninput="logSearch=this.value;$('#logList').innerHTML=renderLogList()"></div>
  <div class="filter-row">
    ${Object.entries(LOG_TYPES).map(([k,v])=>`<button class="chip ${logFilter===k?'on':''}" onclick="logFilter='${k}';render();setTimeout(()=>{const i=$('#logSearch');if(i&&logSearch)i.focus()},0)">${v}</button>`).join("")}
  </div>

    <button class="btn-sm btn-ghost" style="border:1px solid var(--line);border-radius:8px;padding:6px 12px" onclick="exportLogCSV()">⬇ 匯出紀錄</button></div>`:""}
  <div class="card pad" id="logList">${renderLogList()}</div>`;

function renderLogList(){
  let logs=[...(App.state.logs||[])].reverse();
  const q=logSearch.trim().toLowerCase();
  if(logFilter!=="all") logs=logs.filter(LOG_MATCH[logFilter]||(()=>true));
  if(q) logs=logs.filter(l=>(l.target||"").toLowerCase().includes(q)||(l.op||"").toLowerCase().includes(q));
  if(!logs.length) return emptyBox("📋","還沒有符合的紀錄","操作報到或修改資料後,就會出現在這裡");
  const badge={in:"in",ed:"ed",un:"un",lt:"lt"};
  return logs.slice(0,300).map(l=>`<div class="log-item">
    <div class="log-op">${esc(l.op||"未具名")}</div>
    <div class="log-body">
      <div class="log-act"><span class="badge ${badge[l.type]||'sy'}">${esc(l.action)}</span>${l.target?`<b>${esc(l.target)}</b>`:""}</div>
      ${l.detail?`<div class="log-detail">${esc(l.detail)}</div>`:""}
    </div>
    <div class="log-time">${logTimeStr(l.ts)}</div>
  </div>`).join("");
}
function logTimeStr(ts){ if(!ts)return""; const d=new Date(ts); const p=n=>n.toString().padStart(2,"0");
  return `${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`; }
function exportLogCSV(){
  const logs=(App.state.logs||[]); if(!logs.length){ toast("沒有紀錄"); return; }
  let csv="時間,操作人員,動作,對象,明細\n";
  logs.forEach(l=>{ const d=new Date(l.ts);
    csv+=[d.toLocaleString("zh-TW"),l.op||"",l.action||"",l.target||"",l.detail||""].map(x=>`"${String(x).replace(/"/g,'""')}"`).join(",")+"\n"; });
  downloadFile("操作紀錄.csv","\uFEFF"+csv,"text/csv"); toast("已匯出紀錄");
}

function importJSON(e){
  const file=e.target.files[0]; if(!file)return;
  const r=new FileReader();
  r.onload=()=>{ try{ const data=JSON.parse(r.result);
    if(!data.guests){ toast("檔案格式不符"); return; }
    if(!confirm("匯入會覆蓋目前所有資料,確定?")) return;
    App.commit(s=>{ s.guests=data.guests||{}; s.tables=data.tables||{}; s.lottery=data.lottery||{winners:[]}; s.meta=data.meta||{}; });
    toast("已匯入備份"); render();
  }catch(err){ toast("讀取失敗"); } };
  r.readAsText(file); e.target.value="";
}
function importMergeFile(e){
  const file=e.target.files[0]; if(!file)return;
  const r=new FileReader();
  r.onload=()=>{ try{
    const data=JSON.parse(r.result);
    if(!data.guests){ toast("檔案格式不符"); return; }
    if(!confirm("用新名單更新姓名/桌次/喜餅,並保留現有的報到與禮金紀錄(以姓名比對)。確定?")) return;
    let updated=0,added=0,kept=0;
    App.commit(s=>{
      const oldG=s.guests||{};
      const liveByName={}; Object.values(oldG).forEach(g=>{ if(g&&g.name) liveByName[g.name]=g; });
      const merged={}; const usedNames=new Set();
      Object.entries(data.guests).forEach(([id,ng])=>{
        const lv=liveByName[ng.name];
        if(lv){ usedNames.add(ng.name); updated++;
          merged[id]=Object.assign({},ng,{
            arrived:!!lv.arrived, arrivedTime:lv.arrivedTime||null, checkinBy:lv.checkinBy||null,
            giftAmount:Number(lv.giftAmount)||0, cookieGiven:!!lv.cookieGiven,
            giftOnly:!!lv.giftOnly, prepaid:!!lv.prepaid, giftTime:lv.giftTime||null,
            lastEditBy:lv.lastEditBy||null, lastEditTime:lv.lastEditTime||null,
            companions:(Array.isArray(lv.companions)&&lv.companions.length)?lv.companions:(ng.companions||[])
          });
        } else { merged[id]=ng; added++; }
      });
      Object.values(oldG).forEach(g=>{
        if(g&&g.name&&!usedNames.has(g.name)){
          const rec=g.arrived||g.giftOnly||g.prepaid||(Number(g.giftAmount)>0);
          if(rec){ merged["keep-"+uid()]=Object.assign({},g,{table:null}); kept++; }
        }
      });
      s.guests=merged;
      s.tables=data.tables||s.tables;
      if(data.meta&&data.meta.venue) s.meta.venue=data.meta.venue;
      pushLog(s,"更新名單(保留紀錄)","ed","",`更新 ${updated}·新增 ${added}·保留 ${kept}`);
    });
    toast(`已更新:更新 ${updated}、新增 ${added}、保留紀錄 ${kept}`); render();
  }catch(err){ toast("讀取失敗"); } };
  r.readAsText(file); e.target.value="";
}

function openSheet(html){
  closeSheet();
  modalEl=document.createElement("div");
  modalEl.className="overlay";
  modalEl.innerHTML=`<div class="sheet"><div class="sheet-top"><div class="sheet-grab"></div><button class="sheet-close" onclick="closeSheet()" aria-label="關閉">✕</button></div><div class="sheet-pad">${html}</div></div>`;
  modalEl.addEventListener("click",e=>{ if(e.target===modalEl) closeSheet(); });
  document.body.appendChild(modalEl);
}

function segBind(id){
  const seg=document.getElementById(id); if(!seg)return;
  const sel=seg.querySelector(".on"); seg.dataset.sel=sel?sel.dataset.f:"";
  seg.querySelectorAll("button").forEach(b=>{ b.onclick=()=>{ seg.querySelectorAll("button").forEach(x=>x.classList.remove("on")); b.classList.add("on"); seg.dataset.sel=b.dataset.f; }; });

function downloadFile(name,content,type){
  const blob=new Blob([content],{type}); const url=URL.createObjectURL(blob);
  const a=document.createElement("a"); a.href=url; a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(url),1000);
}
